name: Actualizar noticias de Facebook

on:
  schedule:
    # Solo despierta cada 30 minutos: decidir.py resuelve si toca leer Facebook
    # (seguido con partidos, cada 6 horas con calma). GitHub puede retrasarlo.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      solo_si_toca:
        description: "Respetar la decisión inteligente (si no, lee siempre)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-facebook
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Descargar datos anteriores (rama datos)
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # Si la rama existe, la descarga TIENE que funcionar: seguir sin ella borraría el historial.
          estado=0
          git ls-remote --exit-code --heads "$URL" datos > /dev/null || estado=$?
          if [ "$estado" -eq 0 ]; then
            git clone --depth 1 --branch datos "$URL" datos
          elif [ "$estado" -eq 2 ]; then
            echo "Primera corrida: todavía no existe la rama datos."
            mkdir datos
          else
            exit "$estado"
          fi

      - name: Decidir si toca leer
        id: decidir
        env:
          FORZAR: ${{ github.event_name == 'workflow_dispatch' && !inputs.solo_si_toca }}
        run: python3 decidir.py datos/feed.json

      - uses: actions/setup-python@v6
        if: steps.decidir.outputs.correr == 'true'
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        if: steps.decidir.outputs.correr == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
          pip install -r requirements.txt

      - name: Leer las páginas de Facebook
        if: steps.decidir.outputs.correr == 'true'
        env:
          URL_BASE: https://raw.githubusercontent.com/${{ github.repository }}/datos/
        run: python main.py

      - name: Publicar en la rama datos
        # También si todas las páginas fallaron: queda registrado el error en feed.json.
        if: ${{ !cancelled() && steps.decidir.outputs.correr == 'true' && hashFiles('datos/feed.json') != '' }}
        run: |
          cd datos
          # Un solo commit reemplazado en cada corrida: el repositorio no crece sin límite.
          rm -rf .git
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
